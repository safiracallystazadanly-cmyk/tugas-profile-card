<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Safira Calysta</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="background">
        <div class="shape"></div>
        <div class="shape"></div>
    </div>

    <div class="wrapper">

        <div class="info-box">
            <img src="safira.jpeg" alt="">

            <div class="info">
                <h2>Safira Calysta</h2>
                <p>Web Developer</p>
            </div>
        </div>

        <div class="numbers-grid">
            <div class="box">
                <p>Projects</p>
                <h3>25</h3>
            </div>

            <div class="box">
                <p>Followers</p>
                <h3>1.2K</h3>
            </div>

            <div class="box">
                <p>Following</p>
                <h3>180</h3>
            </div>
        </div>

        <div class="about">
            <h3>About Me</h3>
            <p>
                Hello! Aku Safiraa
            </p>
        </div>

        <div class="buttons">
            <button id="followBtn">Follow</button>
            <button id="messageBtn">Message</button>
        </div>

        <p id="message"></p>

    </div>

    <script src="script.js"></script>
</body>
</html>
